services:
  db:
    image: postgres:17
    container_name: helix-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: helix
      POSTGRES_PASSWORD: helix      # local dev only
      POSTGRES_DB: helix
    ports:
      - "5432:5432"
    volumes:
      - helix_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helix -d helix"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    container_name: helix-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://helix:helix@db:5432/helix
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: helix-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  helix_pgdata:
